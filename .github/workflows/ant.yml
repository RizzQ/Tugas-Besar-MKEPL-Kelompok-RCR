# This workflow will build a Java project with Ant
# Testing Deployment

name: Java CI

on:
  push:
    branches: [ "main", "dev", "dev_*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev", "dev_*"  ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ant compile

      - name: Testing
        run: ant tests

      - name: Inspection
        run: ant checkstyle

      - name: Delivery
        run: |
          New-Item -ItemType Directory -Force -Path out\dist
          javac -d out\classes src\Kalkulator\Kalkulator.java
          jar cfe out\Kalkulator.jar Kalkulator.Kalkulator -C out\classes .
          jpackage --input out --dest out\dist --name KalkulatorGUI --main-jar Kalkulator.jar --main-class Kalkulator.Kalkulator --type exe --app-version 1.0 --vendor MKEPL

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalkulatorGUI-exe
          path: out/dist/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: KalkulatorGUI-exe
          path: release-artifact

      - name: Show downloaded files
        run: |
          pwd
          find release-artifact -maxdepth 5 -type f | sort

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release-artifact/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
