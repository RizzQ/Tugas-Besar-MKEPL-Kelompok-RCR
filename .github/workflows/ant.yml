# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant
# Testing Deployment

name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Build
      run: |
          mkdir out\classes
          javac -d out\classes src\Kalkulator\Kalkulator.java
    - name: Testing
      run: ant tests
    - name: Inspection
      run: ant checkstyle
