# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Build
      run: |
          mkdir --parents out/classes
          javac -d out/classes src/Kalkulator/Kalkulator.java
    - name: Testing
      run: mvn tests
    - name: Inspection
      run: mvn -DskipTests verify
    - name: Delivery
      run: |
          mkdir --parents out/dist
          javac -d out/classes src/Kalkulator/Kalkulator.java
          jar cfe out/Kalkulator.jar Kalkulator.Kalkulator -C out/classes .
          jpackage --input out --name KalkulatorGUI --main-jar Kalkulator.jar --main-class Kalkulator.Kalkulator --type exe --dest dist --app-version 1.0 --vendor MKEPL
    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KalkulatorGUI-exe
        path: dist/
