# This workflow will build a Java project with Ant
# Testing Deployment

name: Java CI

on:
  push:
    branches: [ "main", "dev", "dev_*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev", "dev_*" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ant compile

      - name: Testing
        run: ant tests

      - name: Inspection
        run: ant checkstyle

      - name: Delivery
        run: |
          New-Item -ItemType Directory -Force -Path out\dist
          javac -d out\classes src\Kalkulator\Kalkulator.java
          jar cfe out\Kalkulator.jar Kalkulator.Kalkulator -C out\classes .
          jpackage --input out --dest out\dist --name KalkulatorGUI --main-jar Kalkulator.jar --main-class Kalkulator.Kalkulator --type exe --app-version 1.0 --vendor MKEPL

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalkulatorGUI-exe
          path: out/dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: KalkulatorGUI-exe
          path: release-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          asset_path: release-artifact/out/dist/KalkulatorGUI.exe
          asset_name: KalkulatorGUI.exe
          asset_content_type: application/vnd.microsoft.portable-executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
